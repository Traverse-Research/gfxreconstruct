name: Spyglass Release

# Builds the GFXReconstruct files spyglass ships and publishes them as the release spyglass-<commit>.
# Each archive has the layer, gfxrecon-replay, gfxrecon-convert and gfxrecon-extract for its platform, plus the
# arm64 Android layer and replay APK in android/.

on:
  push:
    branches:
      - dev-spyglass
  workflow_dispatch:

concurrency:
  group: spyglass-release-${{ github.sha }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      run: |
        cmake -S . -B build -A x64 -DD3D12_SUPPORT=OFF -DGFXRECON_ENABLE_OPENXR=OFF -DBUILD_WERROR=OFF
        cmake --build build --config Release --parallel --target VkLayer_gfxreconstruct VkLayer_gfxreconstruct_json gfxrecon-replay gfxrecon-convert gfxrecon-extract
    - name: Collect
      shell: bash
      run: |
        mkdir out
        find build -path '*/Release/*' \( -name 'VkLayer_gfxreconstruct.dll' -o -name 'VkLayer_gfxreconstruct.json' \
          -o -name 'gfxrecon-replay.exe' -o -name 'gfxrecon-convert.exe' -o -name 'gfxrecon-extract.exe' \) -exec cp {} out/ \;
        ls -l out
        test "$(ls out | wc -l)" = 5
    - uses: actions/upload-artifact@v4
      with:
        name: windows-x64
        path: out

  linux:
    # The oldest supported runner, so the binaries run on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-xcb-dev libxcb-keysyms1-dev libwayland-dev libxrandr-dev
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGFXRECON_ENABLE_OPENXR=OFF -DBUILD_WERROR=OFF
        cmake --build build --parallel "$(nproc)" --target VkLayer_gfxreconstruct VkLayer_gfxreconstruct_json gfxrecon-replay gfxrecon-convert gfxrecon-extract
    - name: Collect
      run: |
        mkdir out
        find build -not -path '*/staging-json/*' \( -name 'libVkLayer_gfxreconstruct.so' -o -name 'VkLayer_gfxreconstruct.json' \
          -o -name 'gfxrecon-replay' -o -name 'gfxrecon-convert' -o -name 'gfxrecon-extract' \) -type f -exec cp {} out/ \;
        strip out/libVkLayer_gfxreconstruct.so out/gfxrecon-*
        ls -l out
        test "$(ls out | wc -l)" = 5
    - uses: actions/upload-artifact@v4
      with:
        name: linux-x64
        path: out

  android:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: Build
      run: |
        # A fixed debug key, so new releases of the replay app install over older ones.
        mkdir -p ~/.android
        cp .github/spyglass/debug.keystore ~/.android/debug.keystore
        cd android
        sh gradlew -Parm64-v8a -PGFXR_COMPILE_SDK_VERSION=36 -PGFXR_TARGET_SDK_VERSION=36 :layer:assembleRelease :replay:assembleDebug
    - name: Collect
      run: |
        mkdir out
        ndk_version=$(grep GFXR_NDK_VERSION android/gradle.properties | cut -d= -f2)
        strip="$ANDROID_HOME/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        "$strip" -o out/libVkLayer_gfxreconstruct.so android/layer/build/intermediates/cxx/RelWithDebInfo/*/obj/arm64-v8a/libVkLayer_gfxreconstruct.so
        cp android/tools/replay/build/outputs/apk/debug/replay-debug.apk out/
        ls -l out
    - uses: actions/upload-artifact@v4
      with:
        name: android
        path: out

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Package
      run: |
        mkdir dist
        for platform in windows-x64 linux-x64; do
          mkdir -p "package/$platform/android"
          cp artifacts/$platform/* "package/$platform/"
          cp artifacts/android/* "package/$platform/android/"
          cp LICENSES/LICENSE.txt LICENSES/LICENSE_ThirdParty.txt "package/$platform/"
          echo "$GITHUB_SHA" > "package/$platform/COMMIT"
          chmod +x package/$platform/gfxrecon-* || true
          tar -czf "dist/gfxr-$platform.tar.gz" -C "package/$platform" .
        done
        cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="spyglass-${GITHUB_SHA::12}"
        gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" \
          --notes "GFXReconstruct for spyglass, built from $GITHUB_SHA on dev-spyglass."
